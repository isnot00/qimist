[package]
name = "qimist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sing or hum into your mic: Qimist detects notes and key and plays them as MIDI"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "qimist-standalone"
path = "src/main.rs"

[dependencies]
qimist-dsp = { path = "../crates/qimist-dsp" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
